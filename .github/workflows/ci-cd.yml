name: Angus Masail CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BUILD & TEST BACKEND (Spring Boot 3.3.5 / Java 21)
  # ============================================================================
  backend-build:
    name: Build Backend JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot executable JAR
        run: ./gradlew :backend:bootJar -x test --no-daemon

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angus-backend-jar
          path: backend/build/libs/backend-*.jar
          retention-days: 14

  # ============================================================================
  # 2. BUILD & PUSH DOCKER IMAGE TO DOCKER HUB
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: backend-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'codominator' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'codominator' }}/angusmasail-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push production Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. DEPLOY TO AWS EC2 INSTANCE VIA SSH
  # ============================================================================
  deploy-ec2:
    name: Deploy to AWS EC2
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check EC2 Secrets Availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ EC2 deployment credentials are configured."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ EC2_HOST or EC2_SSH_KEY not set. Skipping automatic EC2 deployment."
          fi

      - name: Deploy to EC2 via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key safely with trailing newline
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # SSH client configuration
          cat << 'EOF' > ~/.ssh/config
          Host ec2-target
            HostName ${{ secrets.EC2_HOST }}
            Port ${{ secrets.EC2_PORT || '22' }}
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 3
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

          # Determine EC2 user: use secret if provided, or test standard defaults (ubuntu / ec2-user)
          TARGET_USER="${EC2_USER}"
          if [ -z "$TARGET_USER" ]; then
            echo "🔍 EC2_USER secret not set, auto-detecting AMI default username..."
            if ssh -F ~/.ssh/config -o BatchMode=yes -o ConnectTimeout=10 "ubuntu@ec2-target" "echo ok" >/dev/null 2>&1; then
              TARGET_USER="ubuntu"
            elif ssh -F ~/.ssh/config -o BatchMode=yes -o ConnectTimeout=10 "ec2-user@ec2-target" "echo ok" >/dev/null 2>&1; then
              TARGET_USER="ec2-user"
            else
              TARGET_USER="ubuntu"
            fi
          fi
          echo "👤 Target EC2 User: $TARGET_USER"

          # Verify SSH connection
          if ! ssh -F ~/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 "$TARGET_USER@ec2-target" "echo 'SSH connection verified'" ; then
            echo ""
            echo "❌ ERROR: SSH Authentication Failed to $TARGET_USER@${EC2_HOST}"
            echo "👉 Checklist to fix this:"
            echo "   1. Check if EC2_USER is correct ('ubuntu' for Ubuntu AMIs, 'ec2-user' for Amazon Linux)."
            echo "   2. Ensure EC2_SSH_KEY contains the full private key (.pem) associated with this instance."
            echo "   3. Ensure Port 22 is open in AWS Security Group Inbound Rules."
            exit 1
          fi

          # Prepare app directory on EC2
          ssh -F ~/.ssh/config "$TARGET_USER@ec2-target" "mkdir -p ~/angusmasail/docker"

          # Sync docker-compose, deploy script, and configs
          echo "📦 Syncing deployment configuration files..."
          scp -F ~/.ssh/config -r docker-compose.yml deploy-ec2.sh .env.example docker/ "$TARGET_USER@ec2-target:~/angusmasail/"

          # Run automated rollout script
          echo "🚀 Executing deployment script on EC2..."
          ssh -F ~/.ssh/config "$TARGET_USER@ec2-target" "cd ~/angusmasail && chmod +x deploy-ec2.sh && ./deploy-ec2.sh"

  # ============================================================================
  # 4. BUILD ANDROID DEBUG & RELEASE APKS
  # ============================================================================
  android-build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Assemble Android Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease -x test --no-daemon

      - name: Upload Android APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angusmasail-android-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
