name: angusmasail

services:
  nginx:
    image: nginx:alpine
    container_name: angus_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - backend_uploads:/var/www/uploads:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ${DOCKER_IMAGE:-codominator/angusmasail-backend:latest}
    container_name: angus_backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

volumes:
  backend_uploads:
