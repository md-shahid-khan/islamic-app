# Local Development Profile
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:angusmasail-jet-moat.sage.cloud.layerbase.dev}:${SPRING_DATASOURCE_PORT:5432}/${DB_NAME:angusmasail}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      url: ${SPRING_DATA_REDIS_HOST}
      ssl:
        enabled: true  # Recommended for remote cloud Redis instances



  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
        connectiontimeout: 3000
        timeout: 3000
        writetimeout: 3000

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}

logging:
  level:
    root: INFO
    com.codominator.angusmasail: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
