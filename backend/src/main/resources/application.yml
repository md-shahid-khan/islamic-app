server:
  port: ${PORT:8080}

spring:
  application:
    name: angusmasail-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    open-in-view: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:4b29bb88b3f81e3a6c813589b276707328ff9029a1b8ed83427f8a7e0892c575a89f9202a}
    expirationMs: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
    refreshExpirationMs: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  admin:
    # Multiple admins format: email:password:name:phone, separated by comma
    users: ${APP_ADMIN_USERS:admin@angusmasail.com:Admin@123:Super Admin:9999999999}
